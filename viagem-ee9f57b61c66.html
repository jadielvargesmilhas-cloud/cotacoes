:root{
  --bg:#070B19; --bg2:#0B1126; --card:#0E1530; --card2:#131C3D; --ink:#F4F1E8; --ink2:#AEB4C8; --ink3:#7C849C;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16); --gold:#E6BE62; --gold2:#F7E2A6; --gold3:#B88A2E;
  --ok:#4ED19A; --okbg:rgba(78,209,154,.12); --warn:#F2B451; --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --raio:24px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#F5F1E8; --bg2:#EDE7DA; --card:#FFFFFF; --card2:#FBF8F2; --ink:#0E1430; --ink2:#525A72; --ink3:#868CA0;
    --line:rgba(14,20,48,.09); --line2:rgba(14,20,48,.16); --gold:#A9781B; --gold2:#C99A3A; --gold3:#8A6112; --ok:#14935C; --okbg:rgba(20,147,92,.10); --warn:#B9770E; color-scheme:light; }
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(70% 45% at 85% -5%, rgba(230,190,98,.16), transparent 70%), radial-gradient(60% 40% at -10% 30%, rgba(70,110,255,.14), transparent 70%); }
@media (prefers-color-scheme: light){ body::before{ background:radial-gradient(70% 45% at 85% -5%, rgba(201,154,58,.18), transparent 70%), radial-gradient(60% 40% at -10% 30%, rgba(60,90,200,.08), transparent 70%); } }
.pg{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 18px 80px; }
a{ color:inherit; }
button{ font:inherit; color:inherit; }
.olho{ font:600 11.5px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
h2.sec{ font:500 30px/1.15 var(--serif); letter-spacing:-.01em; margin:56px 0 6px; }
h2.sec em{ font-style:italic; color:var(--gold); }
p.sec-sub{ margin:0 0 20px; color:var(--ink2); font-size:15.5px; }

/* topo */
.topo{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.topo img{ width:74px; height:auto; }
.topo .t{ display:flex; flex-direction:column; gap:4px; }
.topo .t b{ font:600 13px/1 var(--sans); letter-spacing:.04em; }
.selo{ margin-left:auto; display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; border:1px solid color-mix(in srgb, var(--gold) 55%, transparent); color:var(--gold2); font:600 12px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; background:color-mix(in srgb, var(--gold) 10%, transparent); }
@media (prefers-color-scheme: light){ .selo{ color:var(--gold3); } }
.selo svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.4; }

/* saudação */
.ola{ font:400 clamp(34px, 8.4vw, 54px)/1.06 var(--serif); letter-spacing:-.02em; margin:0; }
.ola em{ font-style:italic; color:var(--gold); }
.ola-sub{ margin:14px 0 0; color:var(--ink2); font-size:17px; max-width:520px; }

/* contagem */
.contagem{ margin:30px 0 0; display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
.cg-u{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.cg-n{ position:relative; min-width:74px; padding:14px 10px 12px; border-radius:16px; text-align:center; font:500 40px/1 var(--mono); letter-spacing:-.02em; color:var(--gold2);
  background:linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line2); box-shadow:0 18px 40px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); overflow:hidden; perspective:300px; }
@media (prefers-color-scheme: light){ .cg-n{ color:var(--gold3); box-shadow:0 18px 40px -26px rgba(14,20,48,.35); } }
.cg-n::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.35); }
.cg-n.vira span{ display:inline-block; animation:vira .5s cubic-bezier(.3,.7,.3,1); }
@keyframes vira{ from{ transform:rotateX(90deg); opacity:.2; } to{ transform:none; opacity:1; } }
.cg-r{ font:600 10.5px/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); }
.cg-sep{ font:500 34px/1 var(--mono); color:var(--ink3); padding-bottom:34px; }
.contagem{ width:fit-content; max-width:100%; }
.cg-leg{ width:100%; margin-top:6px; color:var(--ink2); font-size:14.5px; text-align:center; }
.cg-leg b{ color:var(--ink); font-weight:600; }

/* passe */
.abas{ display:inline-flex; gap:4px; padding:4px; border-radius:99px; background:var(--card); border:1px solid var(--line); margin:36px 0 14px; }
.abas button{ border:0; background:transparent; padding:9px 18px; border-radius:99px; cursor:pointer; font-weight:600; font-size:14px; color:var(--ink2); }
.abas button.on{ background:linear-gradient(180deg, var(--gold2), var(--gold)); color:#1A1306; box-shadow:0 6px 18px -8px rgba(230,190,98,.7); }
.passe{ position:relative; border-radius:28px; color:#F4F1E8; overflow:hidden; isolation:isolate;
  background:radial-gradient(120% 90% at 100% 0%, #24326B 0%, transparent 55%), radial-gradient(90% 70% at 0% 100%, #2A1F47 0%, transparent 60%), linear-gradient(160deg, #111A3C, #0A1029 70%);
  box-shadow:0 40px 80px -40px rgba(4,8,30,.85), 0 0 0 1px rgba(255,255,255,.08) inset; --mx:50%; --my:30%; --ang:120deg; }
.passe::before{ content:""; position:absolute; inset:0; z-index:-1; opacity:.33; mix-blend-mode:screen; pointer-events:none;
  background:conic-gradient(from var(--ang) at var(--mx) var(--my), rgba(255,215,140,.0), rgba(255,215,140,.55), rgba(140,200,255,.45), rgba(255,140,220,.35), rgba(255,215,140,.0) 60%);
  filter:blur(28px); transition:opacity .4s ease; }
.passe::after{ content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 72% 18%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 42% 8%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 44%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 28% 46%, #fff 50%, transparent 51%); }
.brilho{ position:absolute; inset:-40% -60%; z-index:-1; pointer-events:none; background:linear-gradient(105deg, transparent 42%, rgba(255,240,200,.18) 50%, transparent 58%); transform:translateX(-60%); animation:brilho 3.2s ease .6s 1 forwards; }
@keyframes brilho{ to{ transform:translateX(60%); } }
.p-topo{ display:flex; align-items:center; gap:10px; padding:22px 24px 0; }
.p-topo .olho{ color:#E6BE62; }
.p-topo .p-data{ margin-left:auto; font:500 13px/1 var(--sans); color:#C9CEDF; }

      var v = {dias:Math.floor(s / 86400), horas:Math.floor(s % 86400 / 3600), min:Math.floor(s % 3600 / 60), seg:s % 60};
      Object.keys(v).forEach(function(k){ var n = $('.cg-n[data-u="' + k + '"]'), t = ('0' + v[k]).slice(-2); if (ultimo[k] !== t){ ultimo[k] = t; n.innerHTML = '<span>' + t + '</span>'; n.classList.remove('vira'); void n.offsetWidth; n.classList.add('vira'); } });
      $('#cgLeg').innerHTML = g ? 'para o embarque ' + (V.legs.length > 1 ? (g.k === 'volta' ? 'da volta' : 'da ida') + ' ' : '') + 'em <b>' + esc(g.de.cidade) + '</b>, ' + esc(quando(g.partida, g.de.tz)) + '.' : 'Esperamos que a viagem tenha sido incrível.';
    }

    /* jornada */
    function jornada(){
      var L = marcos(), p = proximo(L), feitos = L.filter(function(x){ return x.feito; }).length;
      var pct = L.length ? feitos / L.length : 0;
      $('#anel .cheio').setAttribute('stroke-dashoffset', String(169.6 * (1 - pct)));
      $('#anelN').textContent = feitos + ' de ' + L.length;
      $('#anelS').textContent = pct >= 1 ? 'Jornada completa. Que viagem!' : 'etapas da jornada concluídas';
      var lin = $('#linha'); lin.style.setProperty('--feito', Math.round(pct * 100) + '%');
      lin.innerHTML = L.map(function(x){
        var st = x.feito ? 'feito' : (x === p ? 'agora' : '');
        var q = x.feito ? (x.manual ? 'Feito' : 'Concluído') : x.aberto ? (x.manual ? 'Agora' : 'Acontecendo') : x.futuro ? (x.id.indexOf('checkin') === 0 ? 'Abre ' + quando(x.ini, x.tz) : x.auto ? quando(x.ini, x.tz) : 'Quando quiser') : (x.manual ? 'Pendente' : 'Concluído');
        if (x.id === 'emitida') q = 'Concluído';
        if (x.id === 'doc' && !x.feito) q = 'Até o dia do voo';
        if (x.id === 'mala' && !x.feito) q = x.futuro ? 'A partir de ' + diaCurto(x.ini, x.tz) : 'Agora';
        var acoes = '';
        if (x.manual){
          acoes += '<button type="button" class="chk' + (x.feito ? ' on' : '') + '" data-marca="' + x.id + '"><i>' + ic('ok') + '</i>' + (x.feito ? 'Feito' : 'Marcar como feito') + '</button>';
          if (x.site) acoes += x.futuro ? '<span class="trava">abre em ' + falta(x.ini) + '</span>' : '<a class="mini" href="' + esc(x.site) + '" target="_blank" rel="noopener">' + ic('bilhete') + 'Fazer check-in na ' + esc(x.cia) + '</a>';
          if (x.avisa && x.feito) acoes += '<a class="mini zap" href="' + esc(zap(x.avisa)) + '" target="_blank" rel="noopener">' + ic('zap') + 'Avisar a VEM</a>';
        }
        return '<li class="mt ' + st + '" data-m="' + x.id + '"><span class="mt-ic">' + ic(x.feito ? 'ok' : x.ic) + '</span><div class="mt-c"><span class="mt-q">' + esc(q) + '</span><b class="mt-t">' + esc(x.t) + '</b><span class="mt-s">' + esc(x.s) + '</span>'
          + (acoes ? '<div class="mt-x">' + acoes + '</div>' : '') + '</div></li>';
      }).join('');
      var f = $('#foco');
      if (!p){ f.innerHTML = '<span class="olho"><i></i>Jornada completa</span><h3>Bem-vindo de volta.</h3><p>Como foi a viagem? A sua opinião ajuda a gente a cuidar ainda melhor da próxima.</p><div class="acoes"><a class="bt zap" href="' + esc(zap('Olá! Voltei da viagem ' + V.ref + '. Quero contar como foi.')) + '" target="_blank" rel="noopener">' + ic('zap') + 'Contar como foi</a></div>'; }
      else {
        var acao = '', tempo = '';
        if (p.id.indexOf('checkin') === 0){
          if (p.futuro){ tempo = 'O check-in abre em ' + falta(p.ini) + ' · ' + quando(p.ini, p.tz); acao = '<button type="button" class="bt" disabled>' + ic('bilhete') + 'Check-in ainda fechado</button>'; }
          else { tempo = 'Aberto agora. Fecha ' + quando(p.fim, p.tz) + '.'; acao = '<a class="bt ouro" href="' + esc(p.site || '#') + '" target="_blank" rel="noopener">' + ic('bilhete') + 'Fazer check-in na ' + esc(p.cia) + '</a><button type="button" class="bt" data-marca="' + p.id + '">' + ic('ok') + 'Já fiz</button>'; }
        } else if (p.manual){ acao = '<button type="button" class="bt ouro" data-marca="' + p.id + '">' + ic('ok') + 'Marcar como feito</button>'; tempo = p.futuro ? 'A partir de ' + quando(p.ini, p.tz) : ''; }
        else { tempo = p.aberto ? 'Acontecendo agora.' : 'Em ' + falta(p.ini) + ' · ' + quando(p.ini, p.tz); }
        f.innerHTML = '<span class="olho"><i></i>Próximo passo</span><h3>' + esc(p.t) + '</h3><p>' + esc(p.s) + '</p>' + (tempo ? '<div class="tempo">' + esc(tempo) + '</div>' : '') + (acao ? '<div class="acoes">' + acao + '</div>' : '');
      }
      $$('[data-marca]').forEach(function(b){ b.onclick = function(){ var id = b.getAttribute('data-marca'); if (feito[id]) delete feito[id]; else feito[id] = new Date().toISOString(); guardar(); jornada(); if (feito[id]) avisar('Pronto. Próximo passo atualizado.'); }; });
    }

    /* agenda (.ics) */
    function ics(){
      function z(ms){ var d = new Date(ms); return d.getUTCFullYear() + ('0' + (d.getUTCMonth() + 1)).slice(-2) + ('0' + d.getUTCDate()).slice(-2) + 'T' + ('0' + d.getUTCHours()).slice(-2) + ('0' + d.getUTCMinutes()).slice(-2) + '00Z'; }
      function lim(t){ return String(t).replace(/[,;\\]/g, function(c){ return '\\' + c; }).replace(/\n/g, '\\n'); }
      var ev = [];
      V.legs.forEach(function(g, i){
        ev.push(['voo-' + g.k, g.partida, g.chegada, '✈ ' + g.de.iata + ' → ' + g.para.iata + ' · ' + g.voos, 'Localizador ' + (g.loc || V.loc[0]) + '. ' + g.cia + ', ' + V.cabine + '. Passe: ' + location.href, g.de.aero, 'PT3H']);
        var abre = g.partida - g.ckH * 36e5; if (abre > Date.now()) ev.push(['checkin-' + g.k, abre, abre + 30 * 6e4, 'Check-in ' + (V.legs.length > 1 ? (i ? 'da volta' : 'da ida') : '') + ' aberto · ' + g.cia, 'Localizador ' + (g.loc || V.loc[0]) + '. ' + (g.site || ''), '', 'PT0M']);
      });
      var t = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//VEM//Passe de Viagem//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
      ev.forEach(function(e){ t.push('BEGIN:VEVENT', 'UID:' + D.id + '-' + e[0] + '@vem', 'DTSTAMP:' + z(Date.now()), 'DTSTART:' + z(e[1]), 'DTEND:' + z(e[2]), 'SUMMARY:' + lim(e[3]), 'DESCRIPTION:' + lim(e[4]));
        if (e[5]) t.push('LOCATION:' + lim(e[5])); t.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + lim(e[3]), 'TRIGGER:-' + e[6], 'END:VALARM', 'END:VEVENT'); });
      t.push('END:VCALENDAR');
      return t.join('\r\n');
    }
    $('#btAgenda').onclick = function(){ var b = new Blob([ics()], {type:'text/calendar;charset=utf-8'}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'viagem-' + ida.para.iata.toLowerCase() + '.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000); avisar('Abra o arquivo para pôr na agenda.'); };
    $('#btPartilha').onclick = function(){ var d = {title:'Nossa viagem para ' + dest.cidade, text:'O passe da nossa viagem para ' + dest.cidade + ':', url:location.href};
      if (navigator.share) navigator.share(d).catch(function(){}); else copiar(location.href); };

    /* hora no destino e tempo (Open-Meteo, sem chave) */
    function relogio(){ $('#relDest').textContent = hm(Date.now(), dest.tz);
      var a = partes(Date.now(), dest.tz), b = partes(Date.now(), 'America/Sao_Paulo'), dif = ((+a.h * 60 + +a.mi) - (+b.h * 60 + +b.mi) + 1440 * ((a.d !== b.d) ? (a.d > b.d || a.m > b.m ? 1 : -1) : 0)) / 60;
      $('#relDif').textContent = !dif ? 'Mesmo horário de Brasília.' : (Math.abs(dif) + (Math.abs(dif) === 1 ? ' hora ' : ' horas ') + (dif > 0 ? 'a mais' : 'a menos') + ' que Brasília.'); }
    var WMO = {0:'Céu limpo', 1:'Quase limpo', 2:'Parcialmente nublado', 3:'Nublado', 45:'Neblina', 48:'Neblina', 51:'Garoa fraca', 53:'Garoa', 55:'Garoa forte', 61:'Chuva fraca', 63:'Chuva', 65:'Chuva forte', 71:'Neve fraca', 73:'Neve', 75:'Neve forte', 80:'Pancadas de chuva', 81:'Pancadas de chuva', 82:'Pancadas fortes', 95:'Trovoadas', 96:'Trovoadas', 99:'Trovoadas'};
    function clima(){
      var dia = partes(ida.chegada, dest.tz), iso = dia.y + '-' + ('0' + dia.m).slice(-2) + '-' + ('0' + dia.d).slice(-2), dias = (ida.chegada - Date.now()) / 864e5;
      var nome = encodeURIComponent(dest.cidade);
      fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name=' + nome).then(function(r){ return r.json(); }).then(function(g){
        var p = g && g.results && g.results[0]; if (!p) throw 0;
        var hoje = dias > 15;
        var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.latitude + '&longitude=' + p.longitude + '&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto' + (hoje ? '&forecast_days=1' : '&start_date=' + iso + '&end_date=' + iso);
        return fetch(url).then(function(r){ return r.json(); }).then(function(f){
          var d = f.daily; if (!d || !d.temperature_2m_max) throw 0;
          $('#climaT').textContent = Math.round(d.temperature_2m_min[0]) + '° a ' + Math.round(d.temperature_2m_max[0]) + '°';
          $('#climaS').textContent = (WMO[d.weather_code[0]] || 'Previsão do dia') + (hoje ? ', hoje. A previsão do dia da chegada aparece 15 dias antes.' : ', no dia da chegada.');
        });
      }).catch(function(){ var c = $('#clima'); if (c) c.remove(); });
    }

    /* revelar ao rolar */
    if ('IntersectionObserver' in window){ var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } }); }, {rootMargin:'0px 0px -8% 0px'}); $$('.revela').forEach(function(el){ io.observe(el); }); }
    else $$('.revela').forEach(function(el){ el.classList.add('on'); });

    /* fotos das experiências em slide: troca a cada 4,5 s, com um zoom lento; cada cartão começa num tempo */
    $$('.ex').forEach(function(c, n){
      var vez = 0;
      function passa(){ var fs = $$('img', c), ps = $$('.pontos i', c); if (fs.length < 2) return; vez = (vez + 1) % fs.length;
        fs.forEach(function(f, i){ f.classList.toggle('on', i === vez); }); ps.forEach(function(p, i){ p.classList.toggle('on', i === vez); }); }
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setTimeout(function(){ passa(); setInterval(passa, 4500); }, 1500 + n * 1300);
    });
    contagem(); jornada(); relogio(); clima();
    setInterval(contagem, 1000); setInterval(function(){ jornada(); relogio(); }, 30000);
  }
})();
</script>
