<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VEM · Sua viagem</title>
<meta property="og:title" content="VEM · Sua viagem">
<meta property="og:description" content="Os voos, o localizador e tudo o que fazer até o embarque.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EEF1F7; --sup:#FFFFFF; --sup-2:#F5F7FB; --tinta:#131C36; --tinta-2:#48536B; --tinta-3:#7A8599;
  --fio:#DDE3EE; --ouro:#F2C230; --ouro-texto:#9A7300; --azul:#3B7BE0; --noite:#0F1A3A; --noite-2:#1C2E63;
  --verde:#178A56; --verde-fundo:#E4F4EC; --raio:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0A1024; --sup:#131D3B; --sup-2:#18244A; --tinta:#EDF1FA; --tinta-2:#B3BDD3; --tinta-3:#8591AC;
    --fio:#253461; --ouro-texto:#F2C230; --verde:#3CC486; --verde-fundo:#11322A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#0A1024; --sup:#131D3B; --sup-2:#18244A; --tinta:#EDF1FA; --tinta-2:#B3BDD3; --tinta-3:#8591AC;
  --fio:#253461; --ouro-texto:#F2C230; --verde:#3CC486; --verde-fundo:#11322A; color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--papel); color:var(--tinta); font-family:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
.pagina{ max-width:720px; margin:0 auto; padding:18px 16px 120px; }

/* ── céu: marca, saudação e rota ─────────────────────────── */
.ceu{ position:relative; overflow:hidden; border-radius:28px; padding:22px 22px 24px; color:#fff; container-type:inline-size;
  background:
    radial-gradient(60% 45% at 88% 8%, rgba(59,123,224,.55), transparent 70%),
    radial-gradient(50% 40% at 0% 100%, rgba(242,194,48,.14), transparent 70%),
    linear-gradient(170deg, var(--noite-2) 0%, var(--noite) 62%); }
.ceu::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background-image:radial-gradient(1.2px 1.2px at 12% 22%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 34% 12%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 58% 30%, #cfe0ff 50%, transparent 51%), radial-gradient(1.4px 1.4px at 76% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 42%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 48%, #cfe0ff 50%, transparent 51%),
    radial-gradient(1px 1px at 66% 8%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 46% 52%, #fff 50%, transparent 51%); }
.topo-ceu{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.logo{ width:clamp(108px, 30cqi, 150px); height:auto; display:block; }
.contagem{ font-size:13px; font-weight:600; color:#0F1A3A; background:var(--ouro); padding:6px 11px; border-radius:99px; white-space:nowrap; }
.saudacao{ position:relative; margin:22px 0 0; }
.saudacao .nome{ display:block; font-size:clamp(17px, 5.3cqi, 23px); font-weight:800; letter-spacing:-.015em; line-height:1.1; font-variation-settings:"wdth" 110; }
.saudacao .linha2{ display:block; margin-top:4px; font-size:clamp(16px, 4.6cqi, 19px); color:#C9D6F2; }

.rota{ position:relative; margin-top:22px; }
.arco{ display:block; width:100%; height:auto; aspect-ratio:300 / 84; overflow:visible; }
.arco .trilha{ fill:none; stroke:rgba(255,255,255,.22); stroke-width:1.4; stroke-dasharray:2 6; }
.arco .feita{ fill:none; stroke:url(#orbita); stroke-width:3.2; stroke-linecap:round; }
.arco .parada circle{ fill:var(--noite); stroke:var(--ouro); stroke-width:2; }
/* Parada, não destino: um pouco menor que GRU e JFK e num branco mais suave. */
.arco .parada text{ fill:#D6E0F5; font:700 11.5px "Archivo", system-ui, sans-serif; letter-spacing:.08em; }
.aviao{ fill:#fff; }
.codigos{ display:flex; justify-content:space-between; align-items:flex-end; gap:8px; margin-top:2px; }
/* Mede pela largura do cartão, não da tela: diminui junto com ele e nunca estoura. */
.codigo{ font-variation-settings:"wdth" 125; font-weight:850; font-size:clamp(17px, 5.4cqi, 27px); line-height:.84; letter-spacing:-.01em; }
.codigo small{ display:block; margin-top:8px; font-size:clamp(12.5px, 3.8cqi, 15px); font-weight:500; letter-spacing:0; color:#C9D6F2; font-variation-settings:"wdth" 100; }
.codigo.dir{ text-align:right; }
.fatos{ position:relative; display:flex; flex-wrap:wrap; gap:7px; margin-top:20px; }
.fato{ padding:6px 11px; border-radius:99px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.15); font-size:13.5px; color:#E4EBFA; }
.fato b{ color:#fff; font-weight:650; }

/* madrugada: o aviso que evita perder o voo */
.madrugada{ display:grid; grid-template-columns:40px 1fr; gap:14px; align-items:start; margin-top:14px; padding:16px 18px; border-radius:var(--raio);
  background:var(--sup); border:1px solid var(--fio); border-left:4px solid var(--ouro); }
.madrugada svg{ width:40px; height:40px; padding:9px; border-radius:12px; background:var(--noite); fill:var(--ouro); }
.madrugada b{ display:block; font-size:16px; font-weight:750; }
.madrugada p{ margin:3px 0 0; font-size:14.5px; color:var(--tinta-2); }

h2{ font-size:17px; font-weight:780; letter-spacing:-.01em; margin:36px 0 14px; font-variation-settings:"wdth" 108; }
.caixa{ background:var(--sup); border:1px solid var(--fio); border-radius:var(--raio); }

/* voo */
.trajeto{ padding:4px 18px; }
.perna{ display:grid; grid-template-columns:18px 1fr auto; gap:0 14px; }
.voo-cab{ grid-column:1 / -1; display:flex; justify-content:space-between; gap:10px; padding:16px 0 6px; font-size:14px; color:var(--tinta-2); }
.voo-cab b{ color:var(--tinta); font-weight:650; }
.eixo{ position:relative; }
.eixo::before{ content:""; position:absolute; left:8px; top:14px; bottom:14px; border-left:2px dotted var(--ouro); }
.ponto{ position:absolute; left:4px; width:10px; height:10px; border-radius:50%; background:var(--ouro); box-shadow:0 0 0 3px color-mix(in oklab, var(--ouro) 25%, transparent); }
.ponto.a{ top:9px; } .ponto.b{ bottom:9px; }
.paradas{ display:flex; flex-direction:column; gap:20px; padding:4px 0 14px; min-width:0; }
.lugar b{ font-variation-settings:"wdth" 120; font-weight:800; font-size:16px; letter-spacing:.01em; margin-right:6px; }
.lugar span{ color:var(--tinta-2); }
.lugar .hora{ display:block; font-size:14.5px; color:var(--tinta-2); margin-top:2px; }
.lugar .hora strong{ color:var(--tinta); font-weight:700; font-size:16.5px; }
.lugar .brasilia{ display:block; font-size:13px; color:var(--ouro-texto); font-weight:600; margin-top:2px; }
.duracao{ align-self:center; font-size:13px; color:var(--tinta-3); text-align:right; white-space:nowrap; padding-bottom:10px; }
.duracao b{ display:block; color:var(--tinta); font-size:15px; font-weight:700; }
.conexao{ display:flex; align-items:center; gap:12px; margin:0 -18px; padding:12px 18px; background:var(--sup-2);
  border-top:1px solid var(--fio); border-bottom:1px solid var(--fio); font-size:14.5px; color:var(--tinta-2); }
.conexao svg{ flex-shrink:0; width:30px; height:30px; padding:6px; border-radius:50%; background:var(--noite); fill:var(--ouro); }
.conexao b{ color:var(--tinta); font-weight:650; }
.nota{ margin:10px 2px 0; font-size:13px; color:var(--tinta-3); }

/* bagagem */
.bagagem{ padding:4px 18px; }
.item{ display:grid; grid-template-columns:36px 1fr; gap:3px 12px; padding:14px 0; }
.item + .item{ border-top:1px solid var(--fio); }
.item svg{ grid-row:span 2; width:36px; height:36px; padding:8px; border-radius:11px; background:var(--verde-fundo); fill:none; stroke:var(--verde); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.item b{ font-weight:680; }
.item .estado{ margin-left:6px; font-size:12.5px; font-weight:700; color:var(--verde); white-space:nowrap; }
.item p{ margin:0; font-size:14px; color:var(--tinta-2); }

/* o valor, separado */
.valor{ padding:6px 18px; }
.linha-valor{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 0; font-size:15.5px; }
.linha-valor + .linha-valor{ border-top:1px solid var(--fio); }
.linha-valor span{ color:var(--tinta-2); }
.linha-valor small{ display:block; font-size:12.5px; color:var(--tinta-3); }
.linha-valor b{ font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.linha-valor.soma{ border-top:2px solid var(--tinta) !important; }
.linha-valor.soma span{ color:var(--tinta); font-weight:700; }
.linha-valor.soma b{ font-size:19px; }

/* pagamento */
.opcoes{ display:grid; gap:10px; }
.opcao{ position:relative; display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:14px; padding:16px 18px;
  background:var(--sup); border:1.5px solid var(--fio); border-radius:var(--raio); cursor:pointer; transition:border-color .15s, box-shadow .15s; }
.opcao input{ position:absolute; left:0; top:0; width:1px; height:1px; margin:0; opacity:0; pointer-events:none; }
.opcao > span{ min-width:0; }
.radio{ width:22px; height:22px; border-radius:50%; border:2px solid var(--tinta-3); display:grid; place-items:center; }
.opcao:has(input:checked){ border-color:var(--azul); box-shadow:0 0 0 3px color-mix(in oklab, var(--azul) 16%, transparent); }
.opcao:has(input:checked) .radio{ border-color:var(--azul); }
.opcao:has(input:checked) .radio::after{ content:""; width:10px; height:10px; border-radius:50%; background:var(--azul); }
.opcao.pix:has(input:checked){ border-color:var(--verde); box-shadow:0 0 0 3px color-mix(in oklab, var(--verde) 16%, transparent); }
.opcao.pix:has(input:checked) .radio{ border-color:var(--verde); }
.opcao.pix:has(input:checked) .radio::after{ background:var(--verde); }
.opcao:has(input:focus-visible){ outline:3px solid var(--ouro); outline-offset:2px; }
.nome-op{ font-weight:700; font-size:16px; }
.sub-op{ display:block; font-size:13.5px; color:var(--tinta-2); margin-top:1px; }
.selo{ display:inline-block; margin-left:8px; padding:2px 8px; border-radius:99px; background:var(--verde-fundo); color:var(--verde); font-size:12px; font-weight:750; vertical-align:2px; }
.preco-op{ text-align:right; font-weight:780; font-size:18px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.preco-op small{ display:block; font-size:12.5px; font-weight:500; color:var(--tinta-3); }

.total{ margin-top:18px; padding:20px 20px 18px; border-radius:22px; color:#fff;
  background:radial-gradient(70% 90% at 100% 0%, rgba(59,123,224,.45), transparent 60%), var(--noite); }
.total-rot{ font-size:14.5px; color:#C9D6F2; }
.total-val{ font-size:clamp(19px, 5.2vw, 24px); font-weight:850; letter-spacing:-.02em; font-variation-settings:"wdth" 112; font-variant-numeric:tabular-nums; }
.total-como{ margin:2px 0 16px; font-size:14px; color:#C9D6F2; }
.zap{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:54px; padding:14px 18px; border-radius:16px;
  background:#25D366; color:#062A14; font-weight:780; font-size:14px; text-decoration:none; }
.zap:focus-visible{ outline:3px solid var(--ouro); outline-offset:3px; }
.zap svg{ width:22px; height:22px; fill:currentColor; flex-shrink:0; }

.rodape{ margin-top:22px; font-size:13px; color:var(--tinta-3); line-height:1.6; }
.rodape b{ color:var(--tinta-2); font-weight:700; }
.assina{ display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--fio); color:var(--tinta-2); font-size:13.5px; }
.assina i{ width:9px; height:9px; border-radius:50%; background:var(--ouro); }

/* barra fixa do celular: total e botão sempre à mão */
.barra{ position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; align-items:center; gap:12px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background:color-mix(in oklab, var(--noite) 94%, transparent);
  backdrop-filter:blur(12px); color:#fff; transform:translateY(110%); transition:transform .25s ease; }
.barra.ver{ transform:none; }
.barra .b-val{ flex:1; min-width:0; }
.barra .b-val b{ display:block; font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.barra .b-val span{ font-size:12.5px; color:#C9D6F2; }
.barra a{ flex-shrink:0; padding:11px 16px; border-radius:12px; background:#25D366; color:#062A14; font-weight:780; font-size:15px; text-decoration:none; }
@media (min-width:760px){ .barra{ display:none; } .pagina{ padding-bottom:64px; } }
@media (max-width:420px){
  .opcao{ grid-template-columns:22px 1fr; row-gap:6px; }
  .preco-op{ grid-column:2; text-align:left; font-size:19px; white-space:normal; }
  .preco-op small{ display:inline-block; margin-left:6px; white-space:nowrap; }
}
@media (min-width:640px){
  .pagina{ padding-top:36px; }
  .ceu{ padding:28px 32px 30px; }
  .trajeto, .bagagem, .valor{ padding-left:24px; padding-right:24px; }
  .conexao{ margin:0 -24px; padding-left:24px; padding-right:24px; }
}

.aviso-pix{ display:flex; align-items:center; gap:9px; margin:0 -18px; padding:12px 18px; border-top:1px solid var(--fio);
  background:var(--verde-fundo); color:var(--verde); font-size:14.5px; font-weight:600; border-radius:0 0 var(--raio) var(--raio); }
.aviso-pix b{ font-weight:800; }
.aviso-pix svg{ width:16px; height:16px; flex-shrink:0; fill:currentColor; }
.preco-op s{ display:block; font-size:13px; font-weight:500; color:var(--tinta-3); text-decoration-thickness:1.5px; }
@media (min-width:640px){ .aviso-pix{ margin:0 -24px; padding-left:24px; padding-right:24px; } }
@media (max-width:420px){ .preco-op s{ display:inline; margin-right:8px; } }

/* ── leitura no celular ───────────────────────────────────────────────────
   Celular no modo normal: letras maiores que no computador. */
@media (max-width:520px){
  body{ font-size:17px; }
  .fato{ font-size:14.5px; }
  .madrugada b{ font-size:17px; } .madrugada p{ font-size:15.5px; }
  h2{ font-size:17px; }
  .voo-cab{ font-size:15px; }
  .lugar b{ font-size:16.5px; } .lugar .hora{ font-size:15.5px; } .lugar .hora strong{ font-size:18px; }
  .lugar .brasilia{ font-size:14.5px; }
  .duracao{ font-size:14px; } .duracao b{ font-size:16.5px; }
  .conexao{ font-size:15.5px; }
  .nota{ font-size:14px; }
  .item b{ font-size:17px; } .item p{ font-size:15px; } .item .estado{ font-size:13.5px; }
  .linha-valor{ font-size:17px; } .linha-valor small{ font-size:14px; } .linha-valor.soma b{ font-size:21px; }
  .aviso-pix{ font-size:15.5px; }
  .nome-op{ font-size:17.5px; } .sub-op{ font-size:15px; } .selo{ font-size:13px; }
  .preco-op{ font-size:20px; } .preco-op s{ font-size:14px; }
  .total-rot, .total-como{ font-size:15.5px; }
  .zap{ font-size:14px; }
  .rodape{ font-size:14.5px; } .assina{ font-size:14.5px; }
  .contagem{ font-size:14px; }
  .barra .b-val b{ font-size:19px; } .barra .b-val span{ font-size:13.5px; } .barra a{ font-size:16px; }
}
/* Celular no modo "Versão para computador": a tela diz que é larga, mas o dedo
   diz que é celular. A página se amplia para o texto voltar a ser legível. */
@media (pointer:coarse) and (min-width:700px) and (max-width:1100px){
  .pagina{ zoom:1.32; }
  .barra{ display:flex; zoom:1.32; }
}

/* ── cartão de embarque: picote entre a rota e os detalhes ─────────────── */
.picote{ position:relative; height:0; margin:22px -22px 0; border-top:2px dashed rgba(255,255,255,.2); }
.picote::before, .picote::after{ content:""; position:absolute; top:-12px; width:22px; height:22px; border-radius:50%; background:var(--papel); }
.picote::before{ left:-11px; } .picote::after{ right:-11px; }
.detalhes{ position:relative; list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
.detalhes li{ display:flex; align-items:center; gap:10px; min-width:0; font-size:14.5px; color:#E4EBFA; line-height:1.3; }
.detalhes li.det-data{ grid-column:1 / -1; font-size:16px; }
.detalhes li.det-data b{ color:#fff; font-weight:700; }
.detalhes svg{ flex-shrink:0; width:34px; height:34px; padding:7px; border-radius:10px; background:rgba(242,194,48,.12);
  border:1px solid rgba(242,194,48,.28); fill:none; stroke:var(--ouro); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
@media (min-width:640px){ .picote{ margin-left:-32px; margin-right:-32px; } .picote::before{ left:-11px; } }
@media (max-width:520px){ .detalhes li{ font-size:15px; } .detalhes li.det-data{ font-size:16.5px; } }
@media (max-width:350px){ .detalhes{ grid-template-columns:1fr; } }

/* ── marca: o desenho da logo e o nome, em texto de verdade ─────────────── */
.marca{ display:flex; align-items:center; gap:12px; min-width:0; }
.marca .logo{ width:clamp(62px, 19cqi, 88px); height:auto; flex-shrink:0; }
.marca-texto{ font-size:clamp(15px, 4.5cqi, 19px); font-weight:750; line-height:1.2; letter-spacing:-.005em; color:#fff; font-variation-settings:"wdth" 104; }
.detalhes li.det-data > span{ display:flex; flex-direction:column; gap:3px; }
.detalhes .contagem{ align-self:flex-start; font-style:normal; font-size:13px; font-weight:700; color:#0F1A3A; background:var(--ouro); padding:3px 10px; border-radius:99px; white-space:nowrap; }

/* O arco se estica com a largura, e o texto dentro dele junto: em tela larga o
   BOG chegava a 36px, quase o tamanho dos códigos. Aqui ele fica proporcional. */
@container (min-width:480px){ .arco .parada text{ font-size:8.6px; } .arco .parada circle{ r:5px; } }

/* Logo e nome empilhados no centro do topo. */
.topo-ceu{ justify-content:center; }
.marca{ flex-direction:column; align-items:center; gap:8px; text-align:center; width:100%; }
.marca .logo{ width:clamp(62px, 18.5cqi, 88px); }
.marca-texto{ font-size:clamp(12px, 3.5cqi, 14.5px); font-weight:400; letter-spacing:.015em; text-wrap:balance; }

/* Botão do WhatsApp numa linha só a partir de 360px. */
@media (min-width:360px){ .zap{ white-space:nowrap; gap:8px; padding-left:14px; padding-right:14px; } }

/* Celular bem estreito: o arco encolhe junto e o BOG ficaria com 9px. */
@container (max-width:300px){ .arco .parada text{ font-size:13.5px; } }

/* Botão do WhatsApp do tamanho do texto, não da caixa. Altura mínima de 48px,
   o tamanho confortável para o dedo. */
.total .zap{ display:inline-flex; width:auto; max-width:100%; min-height:48px; padding:12px 18px; }

@media (max-width:400px){ .total .zap{ font-size:13px; gap:7px; padding:12px 14px; } .total .zap svg{ width:20px; height:20px; } }
@media (max-width:359px){ .total .zap{ font-size:12.5px; white-space:nowrap; padding:12px 12px; } }

/* Botão do WhatsApp sempre no centro da caixa, do tamanho do texto. */
.total .zap{ display:flex; width:fit-content; margin-left:auto; margin-right:auto; }

/* A caixa do total inteira centralizada, como um recibo. */
.total{ text-align:center; }

/* Duração e paradas: no celular, cada uma na largura inteira, numa linha só;
   no computador e no tablet, lado a lado, como os outros pares. */
@media (max-width:640px){
  .detalhes li.det-longo{ grid-column:1 / -1; }
  .detalhes li.det-longo span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
}
@media (prefers-reduced-motion: reduce){ .barra{ transition:none; } }

.sub-viagem{ margin:18px 0 10px; font-size:15px; font-weight:700; color:var(--tinta-2); text-transform:none; }
.det-volta{ font-weight:600 !important; }

.vg-selo{ margin-left:auto; align-self:flex-start; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#0F1A3A; background:linear-gradient(135deg,#F7D65E,#F2B61B); padding:6px 12px; border-radius:999px; }
.topo-ceu{ display:flex; align-items:flex-start; gap:12px; }
.vg-loc{ position:relative; margin:16px 0 4px; padding:14px 16px; border-radius:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.vg-loc-rot{ width:100%; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.7); }
.vg-loc-cod{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; font:800 30px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing:.14em; color:#F7D65E; }
.vg-loc-cod svg{ width:18px; height:18px; fill:none; stroke:rgba(255,255,255,.75); stroke-width:2; }
.vg-loc-cod.copiado svg{ stroke:#3CC486; }
.vg-loc-cod.copiado::after{ content:"copiado"; font:700 11px/1 "Archivo", system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#3CC486; }
.vg-loc small{ width:100%; color:rgba(255,255,255,.7); font-size:13px; }
.vg-progresso{ display:flex; align-items:center; gap:12px; margin:-2px 0 12px; font-size:14px; color:var(--tinta-2); font-weight:600; }
.vg-barra{ flex:1; height:8px; border-radius:99px; background:var(--sup-2); border:1px solid var(--fio); overflow:hidden; }
.vg-barra i{ display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg, var(--verde), #3CC486); transition:width .35s ease; }
.vg-lista{ padding:6px 0 !important; }
.vg-item{ padding:14px 18px; border-top:1px solid var(--fio); }
.vg-item:first-child{ border-top:0; }
.vg-marca{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:start; cursor:pointer; }
.vg-marca input{ position:absolute; opacity:0; pointer-events:none; }
.vg-cx{ width:26px; height:26px; border-radius:9px; border:2px solid var(--fio); display:grid; place-items:center; background:var(--sup); transition:all .2s ease; margin-top:1px; }
.vg-cx svg{ width:16px; height:16px; fill:none; stroke:#fff; stroke-width:3; opacity:0; }
.vg-marca input:focus-visible + .vg-cx{ outline:3px solid var(--azul); outline-offset:2px; }
.vg-item.feito .vg-cx{ background:var(--verde); border-color:var(--verde); }
.vg-item.feito .vg-cx svg{ opacity:1; }
.vg-txt b{ display:block; font-size:17px; }
.vg-item.feito .vg-txt b{ color:var(--tinta-2); text-decoration:line-through; text-decoration-color:var(--verde); }
.vg-quando{ display:inline-block; margin:4px 0 2px; font-size:13px; font-weight:700; color:var(--ouro-texto); }
.vg-txt small{ display:block; font-size:14px; color:var(--tinta-2); line-height:1.5; }
.vg-acoes{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 0 40px; }
.vg-bt{ display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:12px; border:1px solid var(--fio); background:var(--sup-2); color:var(--tinta); font-size:14px; font-weight:700; text-decoration:none; }
.vg-bt svg{ width:16px; height:16px; }
.vg-avisa{ display:none; border-color:var(--verde); color:var(--verde); background:var(--verde-fundo); }
.vg-item.feito .vg-avisa{ display:inline-flex; }
.vg-extras{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
.vg-extra{ display:flex; flex-direction:column; gap:6px; padding:16px; border-radius:var(--raio); background:var(--sup); border:1px solid var(--fio); color:var(--tinta); text-decoration:none; transition:transform .2s ease, border-color .2s ease; }
.vg-extra:hover{ transform:translateY(-2px); border-color:var(--ouro); }
.vg-extra-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--noite-2), var(--noite)); }
.vg-extra-ic svg{ width:20px; height:20px; fill:none; stroke:#F7D65E; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.vg-extra b{ font-size:16px; margin-top:4px; }
.vg-extra small{ font-size:13.5px; color:var(--tinta-2); line-height:1.45; flex:1; }
.vg-extra-cta{ font-size:13px; font-weight:800; color:var(--ouro-texto); }
.vg-extra-cta::after{ content:" →"; }
.vg-ajuda{ margin:26px 0 8px; padding:20px; border-radius:var(--raio); background:linear-gradient(170deg, var(--noite-2), var(--noite)); color:#fff; display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; }
.vg-ajuda > div{ flex:1 1 240px; }
.vg-ajuda b{ font-size:18px; }
.vg-ajuda p{ margin:4px 0 0; color:rgba(255,255,255,.75); font-size:14.5px; }
.vg-ajuda .zap{ margin:0; flex:0 1 auto; }
.vg-tranca{ margin:18vh auto 0; max-width:420px; text-align:center; padding:28px 24px; border-radius:var(--raio); background:var(--sup); border:1px solid var(--fio); }
.vg-tranca b{ font-size:19px; }
.vg-tranca p{ color:var(--tinta-2); }
@media (max-width:620px){ .vg-extras{ grid-template-columns:minmax(0,1fr); } .vg-extra{ display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:14px; } .vg-extra-ic{ grid-row:span 3; } .vg-extra b{ margin-top:0; } .vg-acoes{ margin-left:0; } .vg-loc-cod{ font-size:26px; } .vg-ajuda .zap{ width:100%; justify-content:center; } }

</style>

<script>(function(){
  var main = document.getElementById('vg');
  function de64(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function aviso(t, s){ main.innerHTML = '<section class="vg-tranca"><b>' + t + '</b><p>' + s + '</p></section>'; }
  var m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (!m){ aviso('Abra pelo link completo', 'Esta página é protegida. Use o link que você recebeu no WhatsApp, inteiro.'); return; }
  var D; try { D = JSON.parse(document.getElementById('dados').textContent); } catch(e){ aviso('Página incompleta', 'Peça um link novo no WhatsApp.'); return; }
  if (!window.crypto || !crypto.subtle){ aviso('Navegador sem suporte', 'Abra o link no Chrome, no Safari ou no navegador do celular.'); return; }
  crypto.subtle.importKey('raw', de64(m[1]), 'AES-GCM', false, ['decrypt'])
    .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM', iv:de64(D.iv)}, k, de64(D.c)); })
    .then(function(b){ main.innerHTML = new TextDecoder().decode(b); iniciar(); })
    .catch(function(){ aviso('Link incompleto', 'O fim do link se perdeu. Abra de novo pelo WhatsApp ou peça um link novo.'); });
  function iniciar(){
    var c = document.getElementById('contagem');
    if (c){ var voo = Number(c.getAttribute('data-voo')), dias = Math.ceil((voo - Date.now()) / 864e5), horas = Math.ceil((voo - Date.now()) / 36e5);
      c.textContent = voo < Date.now() ? 'Boa viagem!' : horas <= 24 ? (horas <= 1 ? 'Embarque em menos de 1 hora' : 'Faltam ' + horas + ' horas') : dias === 1 ? 'É amanhã' : 'Faltam ' + dias + ' dias'; }
    var chave = 'vem-viagem-' + D.id, feito = {};
    try { feito = JSON.parse(localStorage.getItem(chave) || '{}') || {}; } catch(e){}
    var cxs = document.querySelectorAll('[data-item]');
    function conta(){ var n = 0; cxs.forEach(function(x){ if (x.checked) n++; x.closest('.vg-item').classList.toggle('feito', x.checked); });
      document.getElementById('vgConta').textContent = n === cxs.length ? 'Tudo pronto. Boa viagem!' : n + ' de ' + cxs.length + ' feitos';
      document.getElementById('vgBarra').style.width = (cxs.length ? n / cxs.length * 100 : 0) + '%'; }
    cxs.forEach(function(x){ x.checked = !!feito[x.getAttribute('data-item')];
      x.addEventListener('change', function(){ feito[x.getAttribute('data-item')] = x.checked ? new Date().toISOString() : undefined; try { localStorage.setItem(chave, JSON.stringify(feito)); } catch(e){} conta(); }); });
    conta();
    document.querySelectorAll('[data-copiar]').forEach(function(b){ b.addEventListener('click', function(){ var t = b.getAttribute('data-copiar');
      var ok = function(){ b.classList.add('copiado'); setTimeout(function(){ b.classList.remove('copiado'); }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, ok); else ok(); }); });
    var caminho = document.getElementById('feita'), aviao = document.getElementById('aviao'); if (!caminho || !aviao) return;
    var L = caminho.getTotalLength();
    function pos(t){ var l = L * t, p = caminho.getPointAtLength(l), a = caminho.getPointAtLength(Math.max(0, l - 1)), q = caminho.getPointAtLength(Math.min(L, l + 1));
      aviao.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + (Math.atan2(q.y - a.y, q.x - a.x) * 180 / Math.PI) + ')');
      caminho.style.strokeDasharray = L; caminho.style.strokeDashoffset = L * (1 - t); }

    var ini = null; function passo(ts){ if (ini === null) ini = ts; var t = Math.min(1, (ts - ini) / 2600); pos(t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2); if (t < 1) requestAnimationFrame(passo); }
    pos(0); requestAnimationFrame(passo);
  }
